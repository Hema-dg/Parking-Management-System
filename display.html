<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#1a1a2e">
    <title>Smart Parking System</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: #f0f2f5;
            padding: 16px;
            padding-bottom: 80px;
        }

        .header {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: white;
            padding: 20px 16px;
            border-radius: 24px;
            margin-bottom: 20px;
            text-align: center;
        }

        .header h1 {
            font-size: 24px;
            margin-bottom: 4px;
        }

        .header p {
            font-size: 12px;
            opacity: 0.9;
        }

        .scanner-card {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            border-radius: 24px;
            padding: 16px;
            margin-bottom: 20px;
            text-align: center;
        }

        .scanner-title {
            color: white;
            font-size: 16px;
            margin-bottom: 12px;
            text-align: center;
        }

        .scan-btn {
            background: #00b4db;
            padding: 16px;
            font-size: 18px;
            border-radius: 50px;
            margin-bottom: 12px;
            border: none;
            color: white;
            font-weight: bold;
        }

        .camera-container {
            position: relative;
            width: 100%;
            max-width: 400px;
            margin: 0 auto;
            border-radius: 20px;
            overflow: hidden;
            display: none;
            background: #000;
        }

        .camera-container.active {
            display: block;
        }

        #video {
            width: 100%;
            height: auto;
            border-radius: 20px;
            background: #000;
        }

        #canvas {
            display: none;
        }

        .scan-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
        }

        .scan-frame {
            width: 80%;
            height: 80px;
            border: 3px solid #00ff88;
            border-radius: 20px;
            box-shadow: 0 0 0 999px rgba(0,0,0,0.5);
            animation: scan 2s infinite;
        }

        @keyframes scan {
            0% { transform: translateY(-30px); opacity: 0.5; }
            50% { transform: translateY(30px); opacity: 1; }
            100% { transform: translateY(-30px); opacity: 0.5; }
        }

        .capture-btn {
            background: #00ff88;
            color: #1a1a2e;
            margin-top: 12px;
            font-weight: bold;
            border: none;
            padding: 14px;
            border-radius: 12px;
            width: 100%;
        }

        .close-camera {
            background: #f44336;
            margin-top: 8px;
            border: none;
            padding: 14px;
            border-radius: 12px;
            width: 100%;
            color: white;
            font-weight: bold;
        }

        .manual-input {
            margin-top: 16px;
        }

        .manual-input input {
            background: rgba(255,255,255,0.9);
            width: 100%;
            padding: 14px;
            font-size: 16px;
            border: none;
            border-radius: 12px;
            text-align: center;
            font-family: monospace;
            font-weight: bold;
        }

        .slots-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 10px;
            color: #333;
        }

        .slots-container {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }

        .slot-card {
            background: white;
            border-radius: 14px;
            padding: 10px 4px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            cursor: pointer;
            transition: transform 0.2s;
        }

        .slot-card:active {
            transform: scale(0.95);
        }

        .slot-card.free {
            border: 2px solid #4CAF50;
            background: linear-gradient(135deg, #fff 0%, #e8f5e9 100%);
        }

        .slot-card.taken {
            border: 2px solid #f44336;
            background: linear-gradient(135deg, #fff 0%, #ffebee 100%);
        }

        .slot-number {
            font-size: 18px;
            font-weight: bold;
        }

        .slot-status {
            font-size: 10px;
            padding: 3px 6px;
            border-radius: 20px;
            display: inline-block;
        }

        .status-free {
            background: #4CAF50;
            color: white;
        }

        .status-taken {
            background: #f44336;
            color: white;
        }

        .slot-vehicle {
            font-size: 8px;
            margin-top: 4px;
            color: #666;
            word-break: break-all;
        }

        .stats-container {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .stat-card {
            flex: 1;
            background: white;
            border-radius: 14px;
            padding: 12px;
            text-align: center;
        }

        .stat-number {
            font-size: 24px;
            font-weight: bold;
            color: #1a1a2e;
        }

        .stat-label {
            font-size: 11px;
            color: #666;
        }

        .card {
            background: white;
            border-radius: 20px;
            padding: 16px;
            margin-bottom: 16px;
        }

        .card h2 {
            font-size: 18px;
            margin-bottom: 14px;
            color: #333;
        }

        button {
            width: 100%;
            padding: 14px;
            font-size: 16px;
            font-weight: 600;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: white;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        button:active {
            opacity: 0.8;
        }

        .result {
            margin-top: 12px;
            padding: 12px;
            border-radius: 12px;
            font-size: 13px;
            display: none;
        }

        .result.success {
            background: #e8f5e9;
            color: #2e7d32;
            display: block;
            border-left: 4px solid #4CAF50;
        }

        .result.error {
            background: #ffebee;
            color: #c62828;
            display: block;
            border-left: 4px solid #f44336;
        }

        .result.info {
            background: #e3f2fd;
            color: #1565c0;
            display: block;
            border-left: 4px solid #2196F3;
        }

        .fee-amount {
            font-size: 28px;
            font-weight: bold;
            color: #4CAF50;
        }

        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: white;
            display: flex;
            padding: 8px 16px;
            box-shadow: 0 -2px 20px rgba(0,0,0,0.1);
        }

        .nav-btn {
            flex: 1;
            text-align: center;
            padding: 10px;
            background: none;
            color: #999;
            border-radius: 30px;
            font-weight: 600;
        }

        .nav-btn.active {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: white;
        }

        .hidden {
            display: none;
        }

        .scanned-text {
            background: #e0e0e0;
            padding: 8px;
            border-radius: 10px;
            margin-top: 10px;
            font-family: monospace;
            font-size: 14px;
            text-align: center;
            color: #1a1a2e;
            font-weight: bold;
        }

        .reset-btn {
            background: #ff9800;
            margin-top: 10px;
            margin-bottom: 20px;
        }

        .scanning-status {
            color: white;
            font-size: 12px;
            margin-top: 8px;
        }
    </style>
    <!-- Tesseract.js for Automatic License Plate Recognition -->
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
</head>
<body>

    <div class="header">
        <h1>Smart Parking System</h1>
        <p>Automatic License Plate Recognition</p>
    </div>

    <!-- Scanner Card -->
    <div class="scanner-card">
        <div class="scanner-title" id="scannerTitle">
            Scan Vehicle License Plate
        </div>
        
        <div class="camera-container" id="cameraContainer">
            <video id="video" autoplay playsinline></video>
            <canvas id="canvas"></canvas>
            <div class="scan-overlay">
                <div class="scan-frame"></div>
            </div>
            <button class="capture-btn" onclick="captureAndDetect()">Capture & Detect Plate</button>
            <button class="close-camera" onclick="closeCamera()">Close Camera</button>
            <div id="scanningStatus" class="scanning-status"></div>
        </div>
        
        <button class="scan-btn" id="openCameraBtn" onclick="openCamera()">
            Open Camera to Scan
        </button>
        
        <div class="manual-input">
            <input type="text" id="manualPlate" placeholder="Or type plate manually (Example: KA01AB1234)" autocomplete="off">
            <div id="scannedPlateDisplay" class="scanned-text hidden"></div>
        </div>
    </div>

    <!-- Slots Display -->
    <div class="slots-title">Parking Slots Status</div>
    <div class="slots-container" id="slotsGrid">Loading...</div>

    <div class="stats-container" id="statsContainer"></div>

    <!-- Entry Section -->
    <div id="entrySection">
        <div class="card">
            <h2>New Vehicle Entry</h2>
            <button onclick="handleEntry()">Park Now - Get Nearest Slot</button>
            <div id="entryResult" class="result"></div>
        </div>
    </div>

    <!-- Exit Section -->
    <div id="exitSection" class="hidden">
        <div class="card">
            <h2>Vehicle Exit and Payment</h2>
            <button onclick="handleExit()">Calculate and Pay</button>
            <div id="exitResult" class="result"></div>
        </div>
    </div>

    <button class="reset-btn" onclick="resetAllData()">Reset All Parking Data</button>

    <!-- Bottom Navigation -->
    <div class="bottom-nav">
        <button class="nav-btn active" onclick="showSection('entry')">Entry</button>
        <button class="nav-btn" onclick="showSection('exit')">Exit</button>
    </div>

    <script>
        // Parking Rates in Rupees
        const HOURLY_RATE = 50; // 50 Rupees per hour
        const MINIMUM_FEE = 30;  // Minimum 30 Rupees

        // Parking System Data
        let parkingSlots = {};
        let currentScannedPlate = '';
        let stream = null;
        let currentMode = 'entry';
        let isScanning = false;

        // Initialize parking slots
        function initParking() {
            const saved = localStorage.getItem('parkingSystem');
            if (saved) {
                parkingSlots = JSON.parse(saved);
            } else {
                for (let i = 1; i <= 10; i++) {
                    parkingSlots[i] = {
                        slot_id: i,
                        status: 'free',
                        vehicle: null,
                        entry_time: null
                    };
                }
            }
            saveToLocalStorage();
            updateDisplay();
        }

        function saveToLocalStorage() {
            localStorage.setItem('parkingSystem', JSON.stringify(parkingSlots));
        }

        function getFreeCount() {
            let count = 0;
            for (let i = 1; i <= 10; i++) {
                if (parkingSlots[i].status === 'free') count++;
            }
            return count;
        }

        function allocateSlot(vehicle) {
            for (let i = 1; i <= 10; i++) {
                if (parkingSlots[i].status === 'free') {
                    parkingSlots[i].status = 'taken';
                    parkingSlots[i].vehicle = vehicle;
                    parkingSlots[i].entry_time = new Date().toISOString();
                    saveToLocalStorage();
                    updateDisplay();
                    return {
                        success: true,
                        vehicle: vehicle,
                        slot: i,
                        message: `Go to Slot ${i}`
                    };
                }
            }
            return {
                success: false,
                message: "Parking is full. No slots available."
            };
        }

        function exitVehicle(vehicle) {
            for (let i = 1; i <= 10; i++) {
                if (parkingSlots[i].vehicle === vehicle) {
                    const entryTime = new Date(parkingSlots[i].entry_time);
                    const exitTime = new Date();
                    
                    const durationMinutes = (exitTime - entryTime) / 1000 / 60;
                    const durationHours = durationMinutes / 60;
                    
                    let fee = durationHours * HOURLY_RATE;
                    if (fee < MINIMUM_FEE) fee = MINIMUM_FEE;
                    
                    parkingSlots[i].status = 'free';
                    parkingSlots[i].vehicle = null;
                    parkingSlots[i].entry_time = null;
                    saveToLocalStorage();
                    updateDisplay();
                    
                    return {
                        success: true,
                        vehicle: vehicle,
                        slot: i,
                        duration_minutes: Math.round(durationMinutes),
                        total_amount: Math.round(fee)
                    };
                }
            }
            return {
                success: false,
                message: `Vehicle '${vehicle}' not found in system`
            };
        }

        function resetAllData() {
            if (confirm('Are you sure you want to reset all parking data?')) {
                for (let i = 1; i <= 10; i++) {
                    parkingSlots[i] = {
                        slot_id: i,
                        status: 'free',
                        vehicle: null,
                        entry_time: null
                    };
                }
                saveToLocalStorage();
                updateDisplay();
                showResult(currentMode === 'entry' ? 'entryResult' : 'exitResult', 
                    'All parking data has been reset.', 'success');
                document.getElementById('manualPlate').value = '';
                currentScannedPlate = '';
                document.getElementById('scannedPlateDisplay').classList.add('hidden');
            }
        }

        function updateDisplay() {
            let html = '';
            let freeCount = 0;
            
            for (let i = 1; i <= 10; i++) {
                const slot = parkingSlots[i];
                if (slot.status === 'free') freeCount++;
                html += `
                    <div class="slot-card ${slot.status}" onclick="quickFill('${slot.vehicle || ''}')">
                        <div class="slot-number">${slot.slot_id}</div>
                        <div class="slot-status status-${slot.status}">
                            ${slot.status === 'free' ? 'FREE' : 'TAKEN'}
                        </div>
                        <div class="slot-vehicle">${slot.vehicle || '---'}</div>
                    </div>
                `;
            }
            
            document.getElementById('slotsGrid').innerHTML = html;
            
            document.getElementById('statsContainer').innerHTML = `
                <div class="stat-card">
                    <div class="stat-number">${freeCount}</div>
                    <div class="stat-label">Free Slots</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number">${10 - freeCount}</div>
                    <div class="stat-label">Occupied</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number">10</div>
                    <div class="stat-label">Total Slots</div>
                </div>
            `;
        }

        function quickFill(vehicle) {
            if (vehicle && vehicle !== '---') {
                document.getElementById('manualPlate').value = vehicle;
            }
        }

        // Camera and Automatic License Plate Detection
        function showSection(section) {
            currentMode = section;
            if (section === 'entry') {
                document.getElementById('entrySection').classList.remove('hidden');
                document.getElementById('exitSection').classList.add('hidden');
                document.querySelector('.nav-btn:first-child').classList.add('active');
                document.querySelector('.nav-btn:last-child').classList.remove('active');
                document.getElementById('scannerTitle').innerHTML = 'Scan Entry Vehicle Plate';
            } else {
                document.getElementById('entrySection').classList.add('hidden');
                document.getElementById('exitSection').classList.remove('hidden');
                document.querySelector('.nav-btn:first-child').classList.remove('active');
                document.querySelector('.nav-btn:last-child').classList.add('active');
                document.getElementById('scannerTitle').innerHTML = 'Scan Exit Vehicle Plate';
            }
        }

        async function openCamera() {
            const container = document.getElementById('cameraContainer');
            container.classList.add('active');
            
            try {
                stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: 'environment' } 
                });
                const video = document.getElementById('video');
                video.srcObject = stream;
            } catch(err) {
                alert('Cannot access camera: ' + err.message);
            }
        }

        function closeCamera() {
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
                stream = null;
            }
            document.getElementById('cameraContainer').classList.remove('active');
            document.getElementById('scanningStatus').innerHTML = '';
        }

        // Automatic License Plate Recognition using Tesseract.js
        async function captureAndDetect() {
            if (isScanning) return;
            isScanning = true;
            
            const video = document.getElementById('video');
            const canvas = document.getElementById('canvas');
            const context = canvas.getContext('2d');
            
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            context.drawImage(video, 0, 0, canvas.width, canvas.height);
            
            const statusDiv = document.getElementById('scanningStatus');
            statusDiv.innerHTML = 'Processing image... Detecting license plate...';
            
            try {
                // Use Tesseract.js for OCR
                const { data: { text } } = await Tesseract.recognize(
                    canvas,
                    'eng',
                    {
                        logger: (m) => {
                            if (m.status === 'recognizing text') {
                                statusDiv.innerHTML = `Reading plate: ${Math.round(m.progress * 100)}%`;
                            }
                        },
                        tessedit_char_whitelist: 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789'
                    }
                );
                
                statusDiv.innerHTML = 'Processing detected text...';
                
                // Extract license plate pattern (letters and numbers, 8-12 characters)
                const plateMatch = text.match(/[A-Z0-9]{8,12}/);
                
                if (plateMatch) {
                    currentScannedPlate = plateMatch[0];
                    document.getElementById('manualPlate').value = currentScannedPlate;
                    document.getElementById('scannedPlateDisplay').innerHTML = `Detected: ${currentScannedPlate}`;
                    document.getElementById('scannedPlateDisplay').classList.remove('hidden');
                    
                    statusDiv.innerHTML = `License plate detected: ${currentScannedPlate}`;
                    
                    closeCamera();
                    
                    setTimeout(() => {
                        if (currentMode === 'entry') {
                            handleEntry();
                        } else {
                            handleExit();
                        }
                    }, 1000);
                } else {
                    statusDiv.innerHTML = 'Could not detect license plate. Please try again or type manually.';
                    showResult(currentMode === 'entry' ? 'entryResult' : 'exitResult', 
                        'License plate not detected. Please position the plate clearly in the frame.', 'error');
                }
            } catch(err) {
                console.error('OCR Error:', err);
                statusDiv.innerHTML = 'Detection failed. Please type manually.';
                showResult(currentMode === 'entry' ? 'entryResult' : 'exitResult', 
                    'Automatic detection failed. Please enter plate number manually.', 'error');
            }
            
            isScanning = false;
        }

        function handleEntry() {
            let vehicle = currentScannedPlate || document.getElementById('manualPlate').value.trim().toUpperCase();
            
            if (!vehicle) {
                showResult('entryResult', 'Please scan or type vehicle number', 'error');
                return;
            }
            
            const result = allocateSlot(vehicle);
            
            if (result.success) {
                showResult('entryResult', 
                    `SUCCESS - Vehicle ${result.vehicle} assigned to SLOT ${result.slot}. ${result.message}`, 
                    'success'
                );
                document.getElementById('manualPlate').value = '';
                currentScannedPlate = '';
                document.getElementById('scannedPlateDisplay').classList.add('hidden');
            } else {
                showResult('entryResult', `FAILED - ${result.message}`, 'error');
            }
        }

        function handleExit() {
            let vehicle = currentScannedPlate || document.getElementById('manualPlate').value.trim().toUpperCase();
            
            if (!vehicle) {
                showResult('exitResult', 'Please scan or type vehicle number', 'error');
                return;
            }
            
            const result = exitVehicle(vehicle);
            
            if (result.success) {
                showResult('exitResult', 
                    `SUCCESS - Vehicle ${result.vehicle}<br>Duration: ${result.duration_minutes} minutes<br>TOTAL AMOUNT: ₹${result.total_amount}`, 
                    'success'
                );
                document.getElementById('manualPlate').value = '';
                currentScannedPlate = '';
                document.getElementById('scannedPlateDisplay').classList.add('hidden');
            } else {
                showResult('exitResult', `FAILED - ${result.message}`, 'error');
            }
        }

        function showResult(elementId, message, type) {
            const el = document.getElementById(elementId);
            el.innerHTML = message;
            el.className = `result ${type}`;
            setTimeout(() => { 
                if (el.className === `result ${type}`) {
                    el.className = 'result';
                }
            }, 5000);
        }

        // Initialize
        initParking();
        setInterval(() => {
            updateDisplay();
        }, 1000);
    </script>
</body>
</html>
